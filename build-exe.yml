name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "PPTFontReplacer" ppt_font_replacer.py

      - name: Prepare fonts folder
        run: |
          New-Item -ItemType Directory -Force -Path "dist\fonts"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PPTFontReplacer-exe
          path: |
            dist/PPTFontReplacer.exe
            dist/fonts/

      - name: Create Release (only on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PPTFontReplacer.exe
